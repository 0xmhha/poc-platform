version: 2
updates:
  # Node.js dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      typescript:
        patterns:
          - "typescript"
          - "@types/*"
      viem:
        patterns:
          - "viem"
          - "wagmi"
      build-tools:
        patterns:
          - "tsup"
          - "turbo"
          - "@biomejs/*"
      testing:
        patterns:
          - "vitest"
          - "@vitest/*"
    ignore:
      # TypeScript 7 breaks the tsup declaration build (@stablenet/contracts).
      - dependency-name: "typescript"
        versions: [">=7.0.0"]
      # tsup 9 requires Node ^22.18 || ^24.11 || >=26, narrower than engines (>=22.12.0).
      - dependency-name: "tsup"
        versions: [">=9.0.0"]

  # Go dependencies
  - package-ecosystem: "gomod"
    directory: "/services/order-router"
    schedule:
      interval: "weekly"

  - package-ecosystem: "gomod"
    directory: "/services/subscription-executor"
    schedule:
      interval: "weekly"

  - package-ecosystem: "gomod"
    directory: "/services/bridge-relayer"
    schedule:
      interval: "weekly"

  - package-ecosystem: "gomod"
    directory: "/services/bank-simulator"
    schedule:
      interval: "weekly"

  - package-ecosystem: "gomod"
    directory: "/services/pg-simulator"
    schedule:
      interval: "weekly"

  - package-ecosystem: "gomod"
    directory: "/services/onramp-simulator"
    schedule:
      interval: "weekly"

  - package-ecosystem: "gomod"
    directory: "/packages/sdk-go"
    schedule:
      interval: "weekly"

  - package-ecosystem: "gomod"
    directory: "/services/shared/go"
    schedule:
      interval: "weekly"

  # Rust dependencies
  - package-ecosystem: "cargo"
    directory: "/services/stealth-server"
    schedule:
      interval: "weekly"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
