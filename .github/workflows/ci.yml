name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: only read access by default
permissions:
  contents: read
  actions: read

jobs:
  # ===================
  # TypeScript Projects
  # ===================
  typescript:
    name: TypeScript CI
    runs-on: ubuntu-latest

    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ vars.TURBO_TEAM }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          fetch-depth: 2

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level=high

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test:ci

      - name: Upload wallet extension build
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wallet-extension-${{ github.sha }}
          path: apps/wallet-extension/dist/
          retention-days: 7

  # ===================
  # Go Projects
  # ===================
  golang:
    name: Go CI
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - services/order-router
          - services/subscription-executor
          - services/bridge-relayer
          - services/bank-simulator
          - services/pg-simulator
          - services/onramp-simulator
          - packages/sdk-go
          - services/shared/go

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.8'
          cache-dependency-path: ${{ matrix.service }}/go.sum

      - name: Download dependencies
        working-directory: ${{ matrix.service }}
        run: go mod download

      - name: Build
        working-directory: ${{ matrix.service }}
        run: go build -v ./...

      - name: Test
        working-directory: ${{ matrix.service }}
        run: go test -v ./...

      - name: Vulnerability check
        working-directory: ${{ matrix.service }}
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  # ===================
  # Rust Projects
  # ===================
  rust:
    name: Rust CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            services/stealth-server/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('services/stealth-server/Cargo.lock', 'services/stealth-server/Cargo.toml') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Check formatting
        working-directory: services/stealth-server
        run: cargo fmt --check

      - name: Build
        working-directory: services/stealth-server
        run: cargo build --release --locked

      - name: Test
        working-directory: services/stealth-server
        run: cargo test --all --locked

      - name: Audit dependencies
        working-directory: services/stealth-server
        run: |
          if ! command -v cargo-audit >/dev/null 2>&1; then
            cargo install cargo-audit --locked --quiet
          fi
          cargo audit

  # ===================
  # E2E Tests (temporarily disabled)
  # ===================
  # SKIPPED: Playwright's bundled Chromium on CI does not support MV3 service
  # worker registration, causing all Chrome extension E2E tests to fail with
  # "serviceworker timeout" and "ERR_FILE_NOT_FOUND" errors.
  # TODO: Re-enable once CI has a Chrome build that supports MV3 extensions.
  # Run locally with: cd apps/wallet-extension && npx playwright test
  # e2e:
  #   name: E2E Tests
  #   runs-on: ubuntu-latest
  #   needs: [typescript]
  #   ...

  # ===================
  # Biome Format Check
  # ===================
  format:
    name: Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm check
